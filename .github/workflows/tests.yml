name: Verificar ESF
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check:protocols -- --offline
      - run: npm run test:browser
        env:
          ESF_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-testes
          path: test-results/
